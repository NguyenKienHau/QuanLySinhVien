<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Nhập Dữ Liệu Sinh Viên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-wrapper">
        <div class="banner-section">
            <div class="overlay"></div>
            <div class="banner-content">
                <div class="logo-badge">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>Student Portal</span>
                </div>
                <h1>Cổng Nhập Dữ Liệu Sinh Viên</h1>
                <p>Hệ thống tự động đồng bộ và lưu trữ thông tin sinh viên an toàn vào Supabase Cloud.</p>
            </div>
        </div>

        <div class="form-section">
            <div class="form-header">
                <h2>Điền Thông Tin Sinh Viên</h2>
                <p>Vui lòng kiểm tra kỹ thông tin trước khi nhấn lưu</p>
            </div>

            <form id="studentForm">
                <div class="input-field">
                    <label for="hoTen"><i class="fa-regular fa-user"></i> Họ và Tên</label>
                    <input type="text" id="hoTen" placeholder="Ví dụ: Nguyễn Văn A" required>
                </div>

                <div class="input-field">
                    <label for="maSV"><i class="fa-solid fa-id-card"></i> Mã Sinh Viên</label>
                    <input type="text" id="maSV" placeholder="Ví dụ: 0307261021" required>
                </div>

                <div class="input-field">
                    <label for="lop"><i class="fa-solid fa-users"></i> Lớp Học</label>
                    <input type="text" id="lop" placeholder="Ví dụ: CD CDT 26A" required>
                </div>

                <div class="input-field">
                    <label for="nganh"><i class="fa-solid fa-laptop-code"></i> Ngành Học</label>
                    <input type="text" id="nganh" placeholder="Ví dụ: Cơ Điện Tử" required>
                </div>

                <button type="submit" id="btnSubmit">
                    <span>Lưu Dữ Liệu</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div id="thongBao" class="status-message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
